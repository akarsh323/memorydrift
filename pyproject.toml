[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "memorydrift"
version = "0.1.0"
description = "An Inspect AI eval of agent memory under staleness and poisoning, with an offline dreaming repair pass."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "akarsh323" }]
keywords = [
  "agents",
  "ai-safety",
  "evals",
  "inspect-ai",
  "llm",
  "memory",
  "prompt-injection",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]
dependencies = [
  "inspect-ai>=0.3.289,<0.4",
  "numpy>=1.26",
  "pydantic>=2.7",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.11",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
]
# Optional: the LoRA guard model under src/memorydrift/guard.
guard = [
  "datasets>=3.0",
  "peft>=0.13",
  "scikit-learn>=1.5",
  "torch>=2.4",
  "transformers>=4.45",
]

[project.urls]
Homepage = "https://github.com/akarsh323/memorydrift"
Issues = "https://github.com/akarsh323/memorydrift/issues"

[project.scripts]
memorydrift = "memorydrift.cli:main"

# Registers the tasks and the reference-policy model provider with Inspect,
# so `inspect eval memorydrift/memorydrift` works after `pip install`.
[project.entry-points.inspect_ai]
memorydrift = "memorydrift._registry"

[tool.hatch.build.targets.wheel]
packages = ["src/memorydrift"]

[tool.ruff]
line-length = 80
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "B",   # flake8-bugbear
  "C4",  # flake8-comprehensions
  "D",   # pydocstyle
  "E",   # pycodestyle
  "F",   # pyflakes
  "I",   # isort
  "N",   # pep8-naming
  "PT",  # flake8-pytest-style
  "RUF", # ruff-specific
  "SIM", # flake8-simplify
  "UP",  # pyupgrade
  "W",   # pycodestyle warnings
]
ignore = [
  "D105", # magic methods do not need docstrings
  "D107", # __init__ is documented in the class docstring (Google style)
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
files = ["src/memorydrift"]
exclude = ["src/memorydrift/guard/"]

[[tool.mypy.overrides]]
module = ["inspect_ai.*"]
follow_imports = "silent"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "e2e: runs the full Inspect pipeline with the scripted reference policies",
]

[tool.coverage.run]
branch = true
source = ["memorydrift"]
omit = ["src/memorydrift/guard/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
